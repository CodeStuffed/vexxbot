<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Steps 3D</title>
<meta name="description" content="Animated 3D build steps for the stacker robot, one part at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
:root { --bg:#f4f6f8; --panel:#fff; --ink:#17212b; --muted:#56636f; --line:#d3dae1; --accent:#0a6b8c; --accent-ink:#fff;
  --red:#e01e1e; --f-head:"Space Grotesk","Segoe UI",system-ui,sans-serif; --f-body:"Inter","Segoe UI",system-ui,sans-serif; color-scheme: light; }
* { box-sizing:border-box }
html, body { margin:0; height:100% }
body { background:var(--bg); color:var(--ink); font:16px/1.4 var(--f-body); display:grid; grid-template-rows:auto minmax(0,1fr) auto;
  height:100dvh; overflow:hidden; }
::selection { background:var(--accent); color:var(--accent-ink) }
header { display:flex; gap:10px; align-items:center; padding:10px max(12px, env(safe-area-inset-left)); background:var(--panel);
  border-bottom:1px solid var(--line); min-width:0 }
.home { flex:none; display:grid; place-items:center; width:44px; height:44px; border-radius:10px; color:var(--accent); }
.home:hover { background:var(--bg) }
nav { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; min-width:0; padding:2px }
nav::-webkit-scrollbar { display:none }
nav button { flex:none; font:600 .95rem var(--f-head); padding:9px 16px; border-radius:999px; border:1px solid var(--line);
  background:var(--panel); color:var(--muted); cursor:pointer; text-transform:capitalize }
nav button[aria-current="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
#view { position:relative; min-height:0; touch-action:none }
#view canvas { display:block; width:100%; height:100% }
#leaders { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible }
#labels { position:absolute; inset:0; pointer-events:none; overflow:hidden }
.tag { position:absolute; left:0; top:0; white-space:nowrap; font:600 15px var(--f-body); background:var(--panel); color:var(--ink);
  padding:8px 14px; border-radius:8px; box-shadow:0 2px 10px rgba(23,33,43,.18); transition:opacity .25s ease-out }
.tag b { color:var(--red); margin-left:8px; font:700 16px var(--f-head) }
#load { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:24px; color:var(--muted); font-weight:600 }
#load[hidden] { display:none }
#load .spin { width:42px; height:42px; border-radius:50%; border:4px solid var(--line); border-top-color:var(--accent); margin:0 auto 14px;
  animation:spin .9s linear infinite }
@keyframes spin { to { transform:rotate(1turn) } }
footer { background:var(--panel); border-top:1px solid var(--line); padding:10px max(12px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom)) }
.bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:10px }
.bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s ease-out }
.ctl { display:grid; grid-template-columns:64px 1fr 64px 64px; gap:10px; align-items:center; max-width:560px; margin:0 auto }
.ctl button { height:60px; border-radius:14px; border:1px solid var(--accent); background:var(--panel); color:var(--accent); cursor:pointer;
  display:grid; place-items:center }
.ctl button.go { background:var(--accent); color:var(--accent-ink) }
.ctl button:disabled { opacity:.35; cursor:default }
.ctl button:not(:disabled):hover { filter:brightness(1.06) }
.count { text-align:center; font:700 2rem var(--f-head); font-variant-numeric:tabular-nums }
.count small { font-size:1rem; color:var(--muted); font-weight:600 }
button:focus-visible, a:focus-visible { outline:3px solid #b4560b; outline-offset:2px }
@media (max-width:520px) { .ctl { grid-template-columns:56px 1fr 56px 56px } .ctl button { height:54px } .tag { font-size:13px; padding:6px 10px } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<header>
  <a class="home" href="../" aria-label="Home"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg></a>
  <nav id="groups" aria-label="Robot parts"></nav>
</header>
<main id="view">
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels"></div>
  <div id="load"><div><div class="spin"></div>Loading</div></div>
</main>
<footer>
  <div class="bar"><i id="fill"></i></div>
  <div class="ctl">
    <button id="prev" aria-label="Back"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button>
    <div class="count" aria-live="polite"><span id="num">1</span><small> / <span id="tot">70</span></small></div>
    <button id="replay" aria-label="Play again"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
    <button id="next" class="go" aria-label="Next step"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</footer>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const $ = id => document.getElementById(id);
const view = $('view'), load = $('load');
const HOLD = 1.2, MOVE = 0.8, GAP = 0.25, REST = 1.6;          // seconds: look, slide in, between kinds, look at the result
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f6f8);
const camera = new THREE.PerspectiveCamera(32, 1, 0.3, 600);
scene.add(camera);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x7d8590, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(40, -30, 60); scene.add(sun);
const head = new THREE.DirectionalLight(0xffffff, 0.9); head.position.set(0, 0, 1); camera.add(head);   // light from the viewer

let data, parts = [], cur = 0, t0 = 0, waves = [], cycle = 1, lines = [], tags = [];
const mats = {};
const ghost = new THREE.MeshStandardMaterial({ color: 0xc3cad3, transparent: true, opacity: 0.16, depthWrite: false });
const redMat = new LineMaterial({ color: 0xe01e1e, linewidth: 3.5 });
const mat = rgb => mats[rgb] ??= new THREE.MeshStandardMaterial({
  color: new THREE.Color().setRGB(rgb[0] / 255, rgb[1] / 255, rgb[2] / 255, THREE.SRGBColorSpace),
  roughness: 0.5, metalness: rgb[0] > 140 && Math.abs(rgb[0] - rgb[2]) < 25 ? 0.35 : 0.05 });

function fail(msg) { load.innerHTML = `<div>${msg}</div>`; load.hidden = false; }

async function start() {
  const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
  const loader = new GLTFLoader().setDRACOLoader(draco);
  let gltf;
  try {
    [data, gltf] = await Promise.all([fetch('data.json').then(r => { if (!r.ok) throw r.status; return r.json(); }),
                                      loader.loadAsync('parts.glb')]);
  } catch (e) {
    return fail('The 3D parts could not load. Open this page from a web server, for example GitHub Pages.');
  }
  const geo = {};
  gltf.scene.traverse(o => { if (o.isMesh) { o.geometry.scale(1 / 25.4, 1 / 25.4, 1 / 25.4); geo[o.name] = o.geometry; } });
  parts = data.parts.map(p => {
    const g = new THREE.Group();
    g.matrixAutoUpdate = false;
    const base = new THREE.Matrix4().fromArray(p.m);
    const end = new THREE.Vector3().setFromMatrixPosition(base);
    const dir = new THREE.Vector3(...p.d).normalize();
    const meshes = p.b.map(([k, rgb]) => { const m = new THREE.Mesh(geo['m' + k], mat(rgb)); m.userData.mat = m.material; g.add(m); return m; });
    scene.add(g);
    const box = new THREE.Box3();         // where the part sits when built (long channels reach far from their origin)
    for (const m of meshes) { m.geometry.computeBoundingBox(); box.union(m.geometry.boundingBox.clone().applyMatrix4(base)); }
    return { ...p, g, base, end, dir, start: end.clone().addScaledVector(dir, p.L), meshes, box };
  });
  $('tot').textContent = data.steps.length;
  const nav = $('groups');
  data.groups.forEach(gr => {
    const b = document.createElement('button');
    b.textContent = gr; b.dataset.g = gr;
    b.onclick = () => show(data.steps.findIndex(s => s.g === gr));
    nav.append(b);
  });
  load.hidden = true;
  const fromHash = parseInt(location.hash.replace('#s', ''), 10);
  show(Number.isFinite(fromHash) ? fromHash - 1 : 0);
  addEventListener('hashchange', () => { const n = parseInt(location.hash.replace('#s', ''), 10); if (Number.isFinite(n) && n - 1 !== cur) show(n - 1); });
  requestAnimationFrame(tick);
}

function place(p, k) {                       // k = 1 out on its red line, 0 home
  const m = p.g.matrix.copy(p.base);
  m.elements[12] += p.dir.x * p.L * k; m.elements[13] += p.dir.y * p.L * k; m.elements[14] += p.dir.z * p.L * k;
  p.g.matrixWorldNeedsUpdate = true;
}

function show(i) {
  cur = Math.max(0, Math.min(data.steps.length - 1, i));
  history.replaceState(null, '', '#s' + (cur + 1));
  const g = data.steps[cur].g;
  for (const p of parts) {
    const same = data.steps[p.s].g === g;
    p.g.visible = p.s <= cur;
    for (const m of p.meshes) m.material = same || p.s === cur ? m.userData.mat : ghost;
    place(p, 0);
  }
  // kinds of part in this step, in the order they go on
  const now = parts.filter(p => p.s === cur);
  const byKind = new Map();
  for (const p of now.sort((a, b) => a.w - b.w || a.n.localeCompare(b.n))) {
    const key = p.w + '|' + p.n;
    if (!byKind.has(key)) byKind.set(key, []);
    byKind.get(key).push(p);
  }
  let t = HOLD;
  waves = [...byKind.values()].map(list => {
    const lag = Math.min(0.14, 1.1 / list.length);
    const w = { list, t, lag, end: t + MOVE + lag * (list.length - 1), name: list[0].n };
    t = w.end + GAP;
    return w;
  });
  cycle = t + REST;
  for (const l of lines) { scene.remove(l); l.geometry.dispose(); }
  lines = waves.map(w => {
    const geom = new LineSegmentsGeometry().setPositions(w.list.flatMap(p => [...p.start.toArray(), ...p.end.toArray()]));
    const l = new LineSegments2(geom, redMat); scene.add(l); return l;
  });
  $('labels').replaceChildren(...waves.map(w => {
    const d = document.createElement('div'); d.className = 'tag';
    d.textContent = w.name;
    if (w.list.length > 1) { const b = document.createElement('b'); b.textContent = '×' + w.list.length; d.append(b); }
    return d;
  }));
  tags = [...$('labels').children];
  aim(now, g);
  $('num').textContent = cur + 1;
  $('fill').style.width = (100 * (cur + 1) / data.steps.length) + '%';
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === data.steps.length - 1;
  for (const b of $('groups').children) b.setAttribute('aria-current', b.dataset.g === g);
  $('groups').querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  t0 = performance.now();
}

// camera: frame this sub-assembly so far plus where the new parts start, looking from the side they come from
let fly = null;
function aim(now, g) {
  const box = new THREE.Box3();
  for (const p of parts) if (data.steps[p.s].g === g && p.s <= cur) box.union(p.box);
  for (const p of now) box.union(p.box.clone().translate(p.dir.clone().multiplyScalar(p.L)));
  box.expandByScalar(1);
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const come = now.reduce((v, p) => v.add(p.dir), new THREE.Vector3());
  if (come.length() > 0.1) come.normalize();
  const dir = new THREE.Vector3(1, 1, 0.8).normalize().multiplyScalar(0.8).add(come.multiplyScalar(0.7));
  dir.z = Math.max(dir.z, 0.35); dir.normalize();
  // the box diagonal over-states the size, so 0.7 of the textbook fit distance still keeps everything in view
  const fit = 0.8 * r / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / Math.min(1, Math.max(camera.aspect, 0.5));
  fly = { from: camera.position.clone(), fromT: controls.target.clone(), to: c.clone().addScaledVector(dir, fit), toT: c, t: performance.now(),
          first: camera.position.lengthSq() === 0 };
}

const ease = x => 1 - Math.pow(1 - x, 3);
const tmp = new THREE.Vector3();
function tick(now) {
  requestAnimationFrame(tick);
  if (fly) {
    const k = fly.first ? 1 : Math.min(1, (now - fly.t) / 700);
    camera.position.lerpVectors(fly.from, fly.to, ease(k)); controls.target.lerpVectors(fly.fromT, fly.toT, ease(k));
    if (k >= 1) fly = null;
  }
  controls.update();
  const t = ((now - t0) / 1000) % cycle;
  const svg = [], W = view.clientWidth, H = view.clientHeight;
  waves.forEach((w, i) => {
    w.list.forEach((p, j) => {
      const a = (t - w.t - j * w.lag) / MOVE;
      place(p, still ? (t < w.end ? 1 : 0) : 1 - ease(Math.max(0, Math.min(1, a))));
    });
    lines[i].visible = t < w.end + 0.15;
    // name tag on the kind that is moving (or about to)
    const on = t >= (i ? waves[i - 1].end : 0) && t < w.end + 0.3;
    const tag = tags[i];
    tag.style.opacity = on ? 1 : 0;
    if (on) {
      const p = w.list[0];
      tmp.setFromMatrixPosition(p.g.matrix).project(camera);
      const x = (tmp.x + 1) / 2 * W, y = (1 - tmp.y) / 2 * H;
      const tw = tag.offsetWidth, th = tag.offsetHeight;
      const lx = Math.max(8, Math.min(W - tw - 8, x + (x < W / 2 ? 70 : -70 - tw))), ly = Math.max(8, Math.min(H - th - 8, y - 100));
      tag.style.transform = `translate(${lx}px, ${ly}px)`;
      const ex = lx + (x < lx ? 0 : tw), ey = ly + th / 2;
      svg.push(`<line x1="${x}" y1="${y}" x2="${ex}" y2="${ey}" stroke="#17212b" stroke-width="1.5"/>`,
               `<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="#17212b" stroke-width="2.5" stroke-dasharray="4 3"/>`);
    }
  });
  $('leaders').innerHTML = svg.join('');
  renderer.render(scene, camera);
}

new ResizeObserver(() => {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); redMat.resolution.set(w, h);
}).observe(view);
$('prev').onclick = () => show(cur - 1);
$('next').onclick = () => show(cur + 1);
$('replay').onclick = () => { t0 = performance.now(); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') show(cur + 1);
  else if (e.key === 'ArrowLeft') show(cur - 1);
  else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); t0 = performance.now(); }
});
if (!window.WebGLRenderingContext) fail('This browser cannot show 3D.'); else start();
</script>
</body>
</html>
